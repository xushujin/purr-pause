<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办消息</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(160deg, #f4a460, #ff8c42);
            color: #3d2200;
            padding: 24px;
            user-select: none;
            overflow-y: auto;
        }
        .app {
            min-height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        header {
            background: rgba(255,255,255,0.92);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .count {
            color: #8b5e34;
            font-size: 0.88rem;
        }
        button {
            padding: 8px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.15s;
            background: #fff;
            color: #e07b20;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        button:active { transform: scale(0.97); }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
        }
        .meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 12px;
            color: #8b5e34;
            font-size: 0.78rem;
        }
        .error {
            color: #dc2626;
            max-width: 62%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: right;
        }
        main {
            flex: 1;
            overflow: auto;
            margin-top: 14px;
            background: rgba(255,255,255,0.92);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .notice {
            margin: 0 0 10px;
            padding: 8px 10px;
            border: 1px solid rgba(244,164,96,0.38);
            background: rgba(255, 250, 245, 0.9);
            border-radius: 8px;
            color: #8b5e34;
            font-size: 0.82rem;
        }
        .list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 7px 12px;
            padding: 12px;
            background: #ffffff;
            border: 1px solid rgba(244,164,96,0.34);
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }
        .item:hover,
        .item:focus {
            border-color: #e07b20;
            box-shadow: 0 0 0 3px rgba(244,164,96,0.2);
        }
        .title {
            min-width: 0;
            color: #3d2200;
            font-size: 0.94rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .summary {
            grid-column: 1 / -1;
            color: #8b5e34;
            font-size: 0.83rem;
            line-height: 1.42;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            user-select: text;
        }
        .tag {
            max-width: 150px;
            align-self: start;
            border-radius: 999px;
            padding: 3px 9px;
            color: #ffffff;
            font-size: 0.74rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .foot {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8b5e34;
            font-size: 0.75rem;
            min-width: 0;
        }
        .level {
            text-transform: uppercase;
            color: #6b3a00;
            font-weight: 700;
        }
        .empty {
            min-height: 220px;
            display: grid;
            place-items: center;
            color: #8b5e34;
            text-align: center;
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>待办消息</h1>
        <header>
            <div class="topline">
                <div>
                    <div class="count" id="countText">待办消息（0）</div>
                </div>
                <button id="refreshBtn">刷新</button>
            </div>
            <div class="meta">
                <span id="refreshText">尚未刷新</span>
                <span class="error" id="errorText"></span>
            </div>
        </header>
        <main>
            <p class="notice" id="notice" hidden></p>
            <div class="list" id="list"></div>
            <div class="empty" id="empty">暂无待办消息</div>
        </main>
    </div>

    <script>
        const countText = document.getElementById('countText');
        const refreshText = document.getElementById('refreshText');
        const errorText = document.getElementById('errorText');
        const refreshBtn = document.getElementById('refreshBtn');
        const notice = document.getElementById('notice');
        const list = document.getElementById('list');
        const empty = document.getElementById('empty');

        function formatTime(value) {
            if (!value) return '尚未刷新';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '尚未刷新';
            return '最后刷新 ' + date.toLocaleString('zh-CN', { hour12: false });
        }

        function appendText(parent, className, text) {
            const el = document.createElement('div');
            el.className = className;
            el.textContent = text;
            parent.appendChild(el);
            return el;
        }

        function renderItem(item) {
            const row = document.createElement('div');
            row.className = 'item';
            row.tabIndex = 0;
            row.dataset.id = item.id;

            appendText(row, 'title', item.title || '未命名待办');
            const tag = appendText(row, 'tag', (item.source && item.source.name) || '未知来源');
            const color = item.source && /^#[0-9a-fA-F]{6}$/.test(item.source.color || '') ? item.source.color : '#8b5e34';
            tag.style.backgroundColor = color;

            if (item.summary) appendText(row, 'summary', item.summary);

            const foot = document.createElement('div');
            foot.className = 'foot';
            const level = document.createElement('span');
            level.className = 'level';
            level.textContent = item.level || 'normal';
            const time = document.createElement('span');
            time.textContent = item.updatedAt || item.createdAt || '';
            foot.appendChild(level);
            if (time.textContent) foot.appendChild(time);
            row.appendChild(foot);

            row.addEventListener('click', () => window.electronAPI.openMessageTarget(item.id));
            row.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    window.electronAPI.openMessageTarget(item.id);
                }
            });

            return row;
        }

        function render(state) {
            const total = state.total || 0;
            countText.textContent = `待办消息（${state.badgeCount || total}）`;
            refreshText.textContent = state.loading ? '正在刷新...' : formatTime(state.lastRefreshAt);
            errorText.textContent = state.lastError || '';
            refreshBtn.disabled = !!state.loading || !state.enabled || !state.configured;

            notice.hidden = true;
            notice.textContent = '';
            if (!state.enabled) {
                notice.hidden = false;
                notice.textContent = '消息提醒未启用';
            } else if (!state.configured) {
                notice.hidden = false;
                notice.textContent = '消息服务地址未配置';
            } else if (state.hiddenCount > 0) {
                notice.hidden = false;
                notice.textContent = `仅显示最近 ${state.items.length} 条`;
            } else if (state.backoff) {
                notice.hidden = false;
                notice.textContent = '最近同步失败，已降低轮询频率';
            }

            list.replaceChildren();
            const items = Array.isArray(state.items) ? state.items : [];
            for (const item of items) list.appendChild(renderItem(item));
            empty.hidden = items.length > 0;
        }

        refreshBtn.addEventListener('click', () => {
            window.electronAPI.refreshMessages();
        });

        window.electronAPI.onMessagesState(render);
        window.electronAPI.refreshMessages();
    </script>
</body>
</html>
